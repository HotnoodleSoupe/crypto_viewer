[package]
name = "crypto_viewer"
version = "0.1.0"
edition = "2024"
authors = ["SynapticTwin"] # oder dein GitHub-Handle
description = "CLI tool to track cryptocurrency transactions, break-even and PnL"
license = "MIT"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
